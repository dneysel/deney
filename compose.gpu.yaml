services:
  inference:
    environment:
      MODEL_PROVIDER: llamacpp
      LLAMACPP_URL: http://llama:8080
    depends_on:
      llama:
        condition: service_started

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: ["--model", "/models/${MODEL_FILE:?Set MODEL_FILE}", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "${CONTEXT_SIZE:-4096}", "--n-gpu-layers", "${GPU_LAYERS:-99}"]
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
    gpus: all
    networks:
      - private

networks:
  private:
    driver: bridge