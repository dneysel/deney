services:
  gateway:
    environment:
      VISION_ENABLED: "true"

  inference:
    environment:
      VISION_ENABLED: "true"

  llama:
    command: ["--model", "/models/${MODEL_FILE:?Set MODEL_FILE}", "--mmproj", "/models/${MM_PROJ_FILE:?Set MM_PROJ_FILE}", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "${CONTEXT_SIZE:-4096}", "--n-gpu-layers", "${GPU_LAYERS:-99}"]